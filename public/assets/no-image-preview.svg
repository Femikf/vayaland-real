<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142426" />
      <stop offset="50%" stop-color="#1A2E31" />
      <stop offset="100%" stop-color="#0D1A1C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28C24" />
      <stop offset="100%" stop-color="#F4B41A" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#085056" />
      <stop offset="100%" stop-color="#0E6C74" />
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Architectural Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#archGrid)" />

  <!-- Geometric Architectural Frame Accents -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="rgba(226,140,36,0.15)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M40 70 L40 40 L70 40" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <path d="M1160 70 L1160 40 L1130 40" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <path d="M40 730 L40 760 L70 760" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <path d="M1160 730 L1160 760 L1130 760" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Center Decorative Emblem -->
  <g transform="translate(600, 340)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="url(#tealGrad)" opacity="0.15" />
    <circle r="56" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Camera / Architectural Landscape Motif -->
    <g transform="translate(-36, -32)">
      <path d="M 12 18 L 22 8 L 50 8 L 60 18 L 68 18 C 71.3 18 74 20.7 74 24 L 74 60 C 74 63.3 71.3 66 68 66 L 4 66 C 0.7 66 -2 63.3 -2 60 L -2 24 C -2 20.7 0.7 18 4 18 Z" 
            fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linejoin="round" />
      <circle cx="36" cy="42" r="15" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.2" />
      <circle cx="36" cy="42" r="6" fill="url(#accentGrad)" />
      <circle cx="56" cy="27" r="3" fill="rgba(255,255,255,0.6)" />
    </g>
  </g>

  <!-- Title & Typography -->
  <g text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif">
    <!-- Brand Tag -->
    <text x="600" y="470" fill="url(#accentGrad)" font-size="14" font-weight="700" letter-spacing="4" text-transform="uppercase">
      VAYALAND ARCHITECTURAL REAL ESTATE
    </text>

    <!-- Main Message English -->
    <text x="600" y="515" fill="#FFFFFF" font-size="26" font-weight="600" letter-spacing="2">
      NO PREVIEW IMAGE AVAILABLE
    </text>

    <!-- Malayalam Translation -->
    <text x="600" y="555" fill="rgba(255,255,255,0.7)" font-size="18" font-weight="400" letter-spacing="1">
      ഇമേജ് നിലവിൽ ലഭ്യമല്ല · ഫോട്ടോഗ്രാഫി തയ്യാറായി വരുന്നു
    </text>

    <!-- Subtle Advisory Note -->
    <text x="600" y="595" fill="rgba(255,255,255,0.4)" font-size="13" font-weight="400" letter-spacing="0.5">
      Verified property details available on enquiry
    </text>
  </g>
</svg>
